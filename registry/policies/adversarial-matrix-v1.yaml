id: adversarial-matrix-v1
summary: Matrix-tier gate — rejection requires cross-vendor blocking consensus; single-family consensus is flagged, never trusted alone.
rules:
  - when: blocking_finding
    min_consensus: 0.6
    require_cross_vendor: true
    then: reject
    label: cross-vendor-blocking
  - when: instance_check_failed
    then: revise
    label: failed-instance-criterion
  - when: blocking_finding
    min_consensus: 0.0
    then: revise
    label: any-blocking
  - when: gating_dimension_low
    max_median: 2
    then: revise
    label: gating-dimension-low
  - when: severity_count
    severity: major
    min_consensus: 0.5
    require_cross_vendor: true
    greater_than: 2
    then: approve_with_conditions
    label: cross-vendor-major-load
default: approve
anomalies:
  low_dispersion_unanimity:
    max_mean_dispersion: 0.3
  silent_contrarian: {}
  single_model_consensus:
    min_consensus: 0.6
  charter_breach: {}
